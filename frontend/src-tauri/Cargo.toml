[package]
name = "audimo"
version = "0.1.0"
description = "Audimo — your music + audiobooks, on your hardware."
authors = ["Audimo contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "audimo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Catches `audimo://...` URLs the OS hands to the app — both at launch
# (cold start triggered by the URL) and while running (browser → app
# hand-off). The hosted configure page emits these so users can install
# a whole bundle of addons in one click.
tauri-plugin-deep-link = "2"
# OS keychain (macOS Keychain / Windows Credential Manager / Linux Secret Service)
keyring = "3"
# Cryptographically random API keys
rand = "0.8"
# `if-addrs` enumerates non-loopback local IPs for the phone-access URL hint
if-addrs = "0.13"
# Catalog/manifest fetch + binary download for user-installed addons.
# Blocking client; installs run on a dedicated thread via spawn_blocking.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
