name: release

# Builds Audimo.app, packages it as a DMG, and publishes a GitHub
# Release. macOS arm64 and Windows x86_64 are wired; Intel macOS and
# Linux still need their own libtorrent toolchain story (see
# streaming_server/audimo_streaming.spec for the build-time
# PYTHONPATH dance) and aren't wired here yet.
#
# Windows note: the libtorrent pip wheel installs straight into the
# venv, so no PYTHONPATH gymnastics — just `pip install libtorrent`.
# If wheel availability lags the Python toolchain, pin setup-python
# below to a cp version with a published wheel.
#
# Trigger:
#   - Push a tag of the form `v0.4.0`
#   - Or run manually via Actions → release → Run workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v)'
        required: true
        default: '0.4.0'

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            VERSION="${REF#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ building Audimo $VERSION"

      # ── Toolchains ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # ── System deps ─────────────────────────────────────────────
      # libtorrent-rasterbar ships a Python binding that the streaming
      # sidecar imports. PyInstaller picks it up via collect_all('libtorrent')
      # in audimo_streaming.spec — but only if it's on PYTHONPATH at
      # build time. Homebrew puts it under
      # /opt/homebrew/Cellar/libtorrent-rasterbar/<ver>/lib/python<py>/site-packages.
      - name: Install libtorrent
        run: brew install libtorrent-rasterbar

      # ── Backend sidecar binary ──────────────────────────────────
      - name: Build backend sidecar (PyInstaller)
        working-directory: backend
        run: |
          set -euo pipefail
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt pyinstaller
          ./.venv/bin/pyinstaller audimo_backend.spec --clean --noconfirm
          ls -lh dist/

      # ── Streaming sidecar binary ────────────────────────────────
      - name: Build streaming sidecar (PyInstaller + libtorrent)
        working-directory: streaming_server
        run: |
          set -euo pipefail
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt pyinstaller
          # Point PyInstaller at Homebrew's libtorrent bindings. The
          # exact python subdir varies — pick the newest one available.
          LT_PY_DIR=$(ls -d /opt/homebrew/Cellar/libtorrent-rasterbar/*/lib/python*/site-packages 2>/dev/null | tail -1)
          if [ -z "$LT_PY_DIR" ]; then
            echo "::error::Could not find libtorrent bindings under /opt/homebrew/Cellar/libtorrent-rasterbar"
            exit 1
          fi
          echo "→ PYTHONPATH=$LT_PY_DIR"
          export PYTHONPATH="$LT_PY_DIR"
          ./.venv/bin/pyinstaller audimo_streaming.spec --clean --noconfirm
          ls -lh dist/

      # ── Stage sidecars where Tauri expects them ─────────────────
      - name: Stage sidecar binaries
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/audimo-backend          frontend/src-tauri/binaries/audimo-backend-aarch64-apple-darwin
          cp streaming_server/dist/audimo-streaming frontend/src-tauri/binaries/audimo-streaming-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/*
          ls -lh frontend/src-tauri/binaries/

      # ── Tauri build ─────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app (produces .app + .dmg)
        working-directory: frontend
        run: npx tauri build

      # ── Package + upload ────────────────────────────────────────
      - name: Rename + checksum DMG
        id: artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          SRC=$(ls frontend/src-tauri/target/release/bundle/dmg/Audimo_*_aarch64.dmg | head -1)
          OUT="Audimo_${VERSION}_aarch64.dmg"
          cp "$SRC" "$OUT"
          shasum -a 256 "$OUT" | tee "$OUT.sha256"
          echo "dmg=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$OUT.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: "Audimo ${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tauri builds are unsigned today (no Apple Developer account
          # wired up). Users get the "cannot verify developer" warning
          # on first launch — right-click → Open bypasses it once.
          body: |
            ## Install

            1. Download `Audimo_${{ steps.meta.outputs.version }}_aarch64.dmg` below.
            2. Open the DMG, drag **Audimo** into `/Applications`.
            3. First launch: macOS will say "cannot verify the developer".
               **Right-click → Open** (instead of double-click) to bypass — you only need to do this once.

            ## Requirements

            - macOS 12+ on Apple Silicon
            - `ffmpeg` (`brew install ffmpeg`) — the app warns on first launch if it's missing

            ## Verify

            ```sh
            shasum -a 256 Audimo_${{ steps.meta.outputs.version }}_aarch64.dmg
            ```

            The expected checksum is in `Audimo_${{ steps.meta.outputs.version }}_aarch64.dmg.sha256` above.
          files: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.sha }}

  windows-x86_64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            VERSION="${REF#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ building Audimo $VERSION (windows)"

      # ── Toolchains ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Pin to a Python version with a published libtorrent wheel.
      # As of writing, libtorrent ships cp311/cp312 wheels reliably;
      # newer Python versions sometimes lag — bump only after
      # confirming a matching wheel exists on PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # ── Backend sidecar binary ──────────────────────────────────
      - name: Build backend sidecar (PyInstaller)
        working-directory: backend
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
          .\.venv\Scripts\pyinstaller.exe audimo_backend.spec --clean --noconfirm
          Get-ChildItem dist

      # ── Streaming sidecar binary ────────────────────────────────
      # No Homebrew on Windows — libtorrent installs straight from
      # PyPI as a wheel. PyInstaller's collect_all('libtorrent') in
      # audimo_streaming.spec then bundles the .pyd + DLLs.
      - name: Build streaming sidecar (PyInstaller + libtorrent)
        working-directory: streaming_server
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller libtorrent
          .\.venv\Scripts\pyinstaller.exe audimo_streaming.spec --clean --noconfirm
          Get-ChildItem dist

      # ── Stage sidecars where Tauri expects them ─────────────────
      # Tauri's externalBin resolver appends the target triple + .exe,
      # so the binaries must be named `<base>-<triple>.exe`.
      - name: Stage sidecar binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item backend\dist\audimo-backend.exe          frontend\src-tauri\binaries\audimo-backend-x86_64-pc-windows-msvc.exe
          Copy-Item streaming_server\dist\audimo-streaming.exe frontend\src-tauri\binaries\audimo-streaming-x86_64-pc-windows-msvc.exe
          Get-ChildItem frontend\src-tauri\binaries

      # ── Tauri build ─────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app (produces .msi + .exe installer)
        working-directory: frontend
        run: npx tauri build

      # ── Package + upload ────────────────────────────────────────
      - name: Rename + checksum installers
        id: artifact
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $msiSrc = Get-ChildItem frontend\src-tauri\target\release\bundle\msi\Audimo_*_x64_en-US.msi | Select-Object -First 1
          $nsisSrc = Get-ChildItem frontend\src-tauri\target\release\bundle\nsis\Audimo_*_x64-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiOut = "Audimo_${version}_x64.msi"
          Copy-Item $msiSrc.FullName $msiOut
          (Get-FileHash $msiOut -Algorithm SHA256).Hash + "  " + $msiOut | Tee-Object -FilePath "$msiOut.sha256"
          "msi=$msiOut"           | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "msi_sha=$msiOut.sha256" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if ($nsisSrc) {
            $nsisOut = "Audimo_${version}_x64-setup.exe"
            Copy-Item $nsisSrc.FullName $nsisOut
            (Get-FileHash $nsisOut -Algorithm SHA256).Hash + "  " + $nsisOut | Tee-Object -FilePath "$nsisOut.sha256"
            "nsis=$nsisOut"            | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            "nsis_sha=$nsisOut.sha256" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      # Upload as a workflow artifact (NOT a GitHub Release) so the
      # MSI isn't publicly downloadable while we're still testing. Only
      # accounts with repo access can fetch the artifact from the
      # workflow run page; the file auto-expires after `retention-days`.
      # Switch back to softprops/action-gh-release once we're ready
      # to publish a public Windows build.
      - name: Upload Windows installer (private workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: audimo-windows-x64-${{ steps.meta.outputs.version }}
          path: |
            Audimo_${{ steps.meta.outputs.version }}_x64.msi
            Audimo_${{ steps.meta.outputs.version }}_x64.msi.sha256
            Audimo_${{ steps.meta.outputs.version }}_x64-setup.exe
            Audimo_${{ steps.meta.outputs.version }}_x64-setup.exe.sha256
          if-no-files-found: warn
          retention-days: 30
